server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 1m;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:js|mjs)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
